name: Playwright E2E Tests

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Create .env file
        run: |
          echo "VALID_EMAIL=${{ secrets.VALID_EMAIL }}" >> .env
          echo "VALID_PASSWORD=${{ secrets.VALID_PASSWORD }}" >> .env
          echo "STG_URL=${{ secrets.STG_URL }}" >> .env
          echo "SIMPLE_USER_EMAIL=${{ secrets.SIMPLE_USER_EMAIL }}" >> .env
          echo "SIMPLE_USER_PASSWORD=${{ secrets.SIMPLE_USER_PASSWORD }}" >> .env

      - name: Run Pytest
        run: python -m pytest TP_Polako_E2E/tests -v

      - name: Upload Test Artifacts (Traces, Videos, Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
          retention-days: 7