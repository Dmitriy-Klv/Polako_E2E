name: Playwright E2E Tests

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: TP_Polako_E2E

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Debug Secrets
        env:
          STG_URL: ${{ secrets.STG_URL }}
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
        run: |
          echo "=== DEBUG ==="

          if [ -n "$STG_URL" ]; then
            echo "STG_URL=SET"
            echo "STG_URL_LENGTH=${#STG_URL}"
          else
            echo "STG_URL=EMPTY"
          fi

          if [ -n "$VALID_EMAIL" ]; then
            echo "VALID_EMAIL=SET"
          else
            echo "VALID_EMAIL=EMPTY"
          fi

          python -c "import os; print('Python STG_URL:', repr(os.getenv('STG_URL')))"

      - name: Run Pytest
        env:
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
          STG_URL: ${{ secrets.STG_URL }}
          SIMPLE_USER_EMAIL: ${{ secrets.SIMPLE_USER_EMAIL }}
          SIMPLE_USER_PASSWORD: ${{ secrets.SIMPLE_USER_PASSWORD }}
          HEADLESS: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import os; print('Before pytest:', repr(os.getenv('STG_URL')))"
          python -m pytest tests -v

      - name: Upload Test Artifacts (Traces, Videos, Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: TP_Polako_E2E/artifacts/
          retention-days: 7