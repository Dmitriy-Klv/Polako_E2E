name: Playwright E2E Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: TP_Polako_E2E/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r TP_Polako_E2E/requirements.txt

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Diagnostic Step (Check Secret Presence)
        env:
          CHECK_URL: ${{ secrets.STG_URL }}
        run: |
          if [ -z "$CHECK_URL" ]; then
            echo "❌ ERROR: GitHub Actions does NOT see STG_URL secret!"
            exit 1
          else
            echo "✅ SUCCESS: GitHub Actions successfully loaded STG_URL."
          fi

      - name: Run Playwright Tests
        env:
          STG_URL: ${{ secrets.STG_URL }}
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
          SIMPLE_USER_EMAIL: ${{ secrets.SIMPLE_USER_EMAIL }}
          SIMPLE_USER_PASSWORD: ${{ secrets.SIMPLE_USER_PASSWORD }}
          HEADLESS: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          xvfb-run pytest TP_Polako_E2E/tests \
            --env stg \
            -v \
            --tb=short

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: TP_Polako_E2E/artifacts/
          retention-days: 7