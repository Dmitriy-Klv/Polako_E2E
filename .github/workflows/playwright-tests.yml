name: Playwright E2E Tests

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TP_Polako_E2E

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: TP_Polako_E2E/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright is installed
        run: pip install playwright

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Playwright Tests
        env:
          STG_URL: ${{ secrets.STG_URL }}
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
          SIMPLE_USER_EMAIL: ${{ secrets.SIMPLE_USER_EMAIL }}
          SIMPLE_USER_PASSWORD: ${{ secrets.SIMPLE_USER_PASSWORD }}
          HEADLESS: "true"
          PYTHONPATH: ..
        run: pytest -v --env stg

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
          retention-days: 7