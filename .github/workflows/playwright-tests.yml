name: Playwright E2E Tests

on:
  push:
    branches:
      - develop
      - master
    paths:
      - 'TP_Polako_E2E/**'
      - '.github/workflows/playwright*'

  pull_request:
    branches:
      - develop
      - master
    paths:
      - 'TP_Polako_E2E/**'
      - '.github/workflows/playwright*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: TP_Polako_E2E

    env:
      STG_URL: ${{ secrets.STG_URL }}
      SIMPLE_USER_EMAIL: ${{ secrets.SIMPLE_USER_EMAIL }}
      SIMPLE_USER_PASSWORD: ${{ secrets.SIMPLE_USER_PASSWORD }}
      VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
      HEADLESS: "true"
      PYTHONPATH: ${{ github.workspace }}/TP_Polako_E2E

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TP_Polako_E2E/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('TP_Polako_E2E/requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Pytest
        run: |
          python -m pytest tests -v --tb=short

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: TP_Polako_E2E/artifacts/
          retention-days: 7
          if-no-files-found: ignore